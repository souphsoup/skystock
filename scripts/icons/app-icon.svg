<!-- meStock app icon (original clipboard design), 512 master. The glyph fills a square box
     centred on (256,256) so all four margins match; build.mjs scales it per target.
     Board radius 54.5 = iOS corner (0.2237 x 512) - margin 60, so its corners run concentric with the app mask.
     Full-bleed square: iOS/Android apply their own mask. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#2b4c70"/>
  <g transform="translate(256 256) scale(GLYPH_SCALE) translate(-256 -256)">
    <rect x="60" y="96" width="392" height="356" rx="54.5" fill="#f3f5f8"/>
    <rect x="176" y="60" width="160" height="80" rx="20" fill="#dda552"/>
    <g fill="none" stroke-width="23" stroke-linejoin="round">
      <path d="M120 207.5 L149.9 232.9 L202.8 180.1" stroke="#2e7a57"/>
      <path d="M120 295.5 L149.9 320.9 L202.8 268.1" stroke="#2e7a57"/>
      <path d="M120 383.5 L149.9 408.9 L202.8 356.1" stroke="#a8731f"/>
    </g>
    <g fill="#5b6776">
      <rect x="231.5" y="195.3" width="168.5" height="25.3" rx="12.6"/>
      <rect x="231.5" y="283.4" width="168.5" height="25.3" rx="12.6"/>
      <rect x="231.5" y="371.4" width="168.5" height="25.3" rx="12.6"/>
    </g>
  </g>
</svg>
